name: Import Suishiting source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('Suishiting-1.2.0-source.zip')
          expected = '44529a3283348b3c75cb485c3a658178167dbb4f577e60988a293785ffedb416'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Source checksum mismatch'
          with ZipFile(archive) as source:
              assert source.testzip() is None, 'Source archive is damaged'
              for entry in source.infolist():
                  path = PurePosixPath(entry.filename)
                  assert path.parts[0] == 'Suishiting' and '..' not in path.parts
                  relative = PurePosixPath(*path.parts[1:])
                  if not path.parts[1:]:
                      continue
                  assert relative.parts[0] in {'app', 'packages', 'tool', '.gitignore', 'README.md', 'LICENSE', 'RELEASING.md', 'INTERFACE_CONTRACT.md', 'UI_INTEGRATION_NOTES.md', 'THIRD_PARTY_NOTICES.md', 'VALIDATION.md'}
                  target = Path(*relative.parts)
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(source.read(entry))
          PY
      - name: Commit source files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f app packages tool .gitignore README.md LICENSE RELEASING.md INTERFACE_CONTRACT.md UI_INTEGRATION_NOTES.md THIRD_PARTY_NOTICES.md VALIDATION.md
          git rm Suishiting-1.2.0-source.zip
          git commit -m "Publish complete Suishiting 1.2.0 source tree"
          git push origin HEAD:main
